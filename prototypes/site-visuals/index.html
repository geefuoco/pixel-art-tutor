<!doctype html>
<!--
  PROTOTYPE - throwaway. Do not ship, do not import from app code.

  Question: what should the site look like?
  Plan: four structurally different visual directions (A-D), each rendering three
  screens (Course, Lesson player in Trace Mode, Mobile notice), switchable via
  ?variant=A|B|C|D and ?screen=course|lesson|mobile and the floating bottom bar.

  There is no app yet (T1 / #3 scaffolds it), so this is a standalone page:
  React + Babel from a CDN, no build, no persistence. All data is hard-coded stubs.

  Run: open this file in a browser, or
       python3 -m http.server 8080 -d prototypes/site-visuals
       then visit http://localhost:8080/?variant=A&screen=lesson

  Keys: Left/Right = variant, 1/2/3 = screen.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE - site visuals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #111; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }

  /* ---------- prototype switcher (not part of any design) ---------- */
  .proto-bar { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 9999;
    display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 999px;
    background: #ff2d7a; color: #fff; font: 600 13px/1 system-ui, sans-serif;
    box-shadow: 0 6px 24px rgba(0,0,0,.45), 0 0 0 2px #fff; white-space: nowrap; }
  .proto-bar button { border: 0; background: rgba(255,255,255,.18); border-radius: 999px; padding: 6px 10px; }
  .proto-bar button:hover { background: rgba(255,255,255,.32); }
  .proto-bar .on { background: #fff; color: #ff2d7a; }
  .proto-bar .lbl { min-width: 150px; text-align: center; }
  .proto-bar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.4); margin: 0 4px; }
  @media (max-width: 520px) { .proto-bar { gap: 3px; font-size: 11px; padding: 4px; } .proto-bar button { padding: 5px 7px; } .proto-bar .lbl { min-width: 0; } }

  /* =====================================================================
     A - Arcade: retro game screen, pixel fonts, overworld map, RPG dialog
     ===================================================================== */
  .va { min-height: 100vh; background: #1a1c2c; color: #f4f4f4; font: 22px/1.15 'VT323', monospace; padding: 16px 16px 80px; }
  .va .pf { font-family: 'Press Start 2P', monospace; }
  .va-box { background: #29366f; box-shadow: 0 -4px #f4f4f4, 0 4px #f4f4f4, -4px 0 #f4f4f4, 4px 0 #f4f4f4; margin: 4px; }
  .va-btn { border: 0; background: #3b5dc9; color: #fff; font-size: 11px; padding: 10px 12px;
    box-shadow: 0 -3px #f4f4f4, 0 3px #f4f4f4, -3px 0 #f4f4f4, 3px 0 #f4f4f4, inset -3px -3px #29366f; }
  .va-btn:active { transform: translateY(2px); }
  .va-btn.primary { background: #b13e53; box-shadow: 0 -3px #f4f4f4, 0 3px #f4f4f4, -3px 0 #f4f4f4, 3px 0 #f4f4f4, inset -3px -3px #6b1f33; }
  .va-wrap { max-width: 1100px; margin: 0 auto; }
  .va-hud { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .va-title { font-size: 12px; flex: 1; }
  .va-dim { color: #73eff7; }
  .va-modes { display: flex; gap: 8px; }
  .va-mode { font-family: 'Press Start 2P'; font-size: 10px; padding: 7px 8px; background: #333c57; color: #94b0c2; }
  .va-mode.open { background: #38b764; color: #1a1c2c; }
  .va-mode.passed { background: #ffcd75; color: #1a1c2c; }
  .va-mode.active { outline: 3px solid #f4f4f4; }
  .va-pips { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .va-pip { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; background: #333c57; color: #94b0c2; font-size: 20px; }
  .va-pip span { font-size: 9px; background: #1a1c2c; padding: 5px 6px; }
  .va-pip.done { background: #257179; color: #a7f070; }
  .va-pip.cur { background: #ffcd75; color: #1a1c2c; }
  .va-stage { display: grid; grid-template-columns: 84px 1fr 200px; gap: 18px; align-items: start; }
  .va-inv { padding: 10px; display: grid; gap: 8px; justify-items: center; }
  .va-slot { position: relative; width: 52px; height: 52px; border: 0; background: #1a1c2c; display: grid; place-items: center; }
  .va-slot.on { background: #ffcd75; }
  .va-slot.on svg { stroke: #1a1c2c; }
  .va-key { position: absolute; right: 2px; bottom: 0; font-size: 16px; color: #94b0c2; }
  .va-slot.on .va-key { color: #1a1c2c; }
  .va-sep { width: 100%; height: 4px; background: #f4f4f4; opacity: .3; }
  .va-screen { justify-self: center; padding: 18px; background: #566c86;
    box-shadow: 0 -6px #333c57, 0 6px #333c57, -6px 0 #333c57, 6px 0 #333c57, inset 0 0 0 6px #333c57; }
  .va-pal { padding: 14px; }
  .va-h { font-size: 10px; margin-bottom: 12px; color: #ffcd75; }
  .va-gem { display: flex; align-items: center; gap: 10px; padding: 4px; }
  .va-gem.on { background: #1a1c2c; }
  .va-gem i { width: 28px; height: 28px; box-shadow: inset -4px -4px rgba(0,0,0,.25), inset 4px 4px rgba(255,255,255,.2); }
  .va-dialog { margin-top: 24px; padding: 18px 22px; background: #1a1c2c; position: relative; }
  .va-speaker { position: absolute; top: -14px; left: 18px; background: #b13e53; padding: 6px 10px; font-size: 10px; }
  .va-dialog p { margin: 8px 0 12px; font-size: 24px; max-width: 70ch; }
  .va-row { display: flex; align-items: end; gap: 22px; flex-wrap: wrap; }
  .va-ex { display: flex; gap: 18px; }
  .va-ex figure { margin: 0; text-align: center; font-size: 18px; color: #94b0c2; }
  .va-ex figure svg { margin-bottom: 4px; }
  .va-actions { margin-left: auto; display: flex; gap: 14px; }
  .va-result { margin-top: 14px; color: #ffcd75; font-size: 22px; }
  .va-blink { animation: va-blink 1s steps(1) infinite; }
  @keyframes va-blink { 50% { opacity: 0; } }
  .va-map-layout { display: grid; grid-template-columns: 1fr 260px; gap: 22px; }
  .va-map { position: relative; aspect-ratio: 16 / 10; background-color: #257179;
    background-image: radial-gradient(#38b764 18%, transparent 19%), radial-gradient(#38b764 18%, transparent 19%);
    background-size: 24px 24px; background-position: 0 0, 12px 12px; }
  .va-map svg.path { position: absolute; inset: 0; width: 100%; height: 100%; }
  .va-node { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 6px; text-align: center; width: 120px; }
  .va-node .badge { padding: 8px; background: #f4f4f4; box-shadow: 0 -4px #1a1c2c, 0 4px #1a1c2c, -4px 0 #1a1c2c, 4px 0 #1a1c2c; }
  .va-node.cur .badge { background: #ffcd75; animation: va-bob 1.2s steps(2) infinite; }
  .va-node.locked .badge { background: #566c86; }
  .va-node .name { font-size: 18px; background: #1a1c2c; padding: 1px 6px; }
  .va-node .stars { font-size: 14px; color: #ffcd75; letter-spacing: 2px; }
  @keyframes va-bob { 50% { transform: translateY(-4px); } }
  .va-quest { padding: 16px; }
  .va-quest p { margin: 10px 0; }
  .va-tag { display: inline-block; background: #1a1c2c; padding: 2px 8px; margin: 0 6px 6px 0; font-size: 18px; color: #73eff7; }
  .va-nav { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }
  .va-logo { font-size: 14px; flex: 1; color: #ffcd75; text-shadow: 3px 3px #b13e53; }
  .va-mobile { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 22px; text-align: center; padding: 24px 16px 90px;
    background: #1a1c2c; }
  .va-mobile h1 { font-size: 16px; line-height: 1.6; margin: 0; color: #ffcd75; text-shadow: 3px 3px #b13e53; }
  .va-mobile p { margin: 0; max-width: 30ch; font-size: 24px; }

  /* =====================================================================
     B - Workbench: dense pro-editor shell, docked panels, data table
     ===================================================================== */
  .vb { min-height: 100vh; background: #1e1f22; color: #d6d6da; font: 13px/1.4 'Inter', system-ui, sans-serif; }
  .vb-app { display: grid; grid-template-rows: 36px 1fr 26px; grid-template-columns: 46px 1fr 300px; height: 100vh; padding-bottom: 0; }
  .vb-menu { grid-column: 1 / -1; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: #2b2d31; border-bottom: 1px solid #111; }
  .vb-brand { font-weight: 700; color: #fff; margin-right: 14px; display: flex; gap: 8px; align-items: center; }
  .vb-menu a { padding: 6px 10px; border-radius: 4px; color: #a4a6ad; text-decoration: none; cursor: pointer; }
  .vb-menu a.on, .vb-menu a:hover { background: #3a3c42; color: #fff; }
  .vb-crumbs { margin-left: 16px; color: #7b7e86; }
  .vb-crumbs b { color: #d6d6da; font-weight: 500; }
  .vb-seg { margin-left: auto; display: flex; background: #1e1f22; border-radius: 6px; padding: 2px; }
  .vb-seg span { padding: 4px 10px; border-radius: 4px; color: #7b7e86; font-size: 12px; }
  .vb-seg span.on { background: #4c7dff; color: #fff; }
  .vb-seg span.open { color: #d6d6da; }
  .vb-tools { background: #2b2d31; border-right: 1px solid #111; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; }
  .vb-tool { width: 34px; height: 34px; border: 0; border-radius: 5px; background: transparent; display: grid; place-items: center; position: relative; }
  .vb-tool:hover { background: #3a3c42; }
  .vb-tool.on { background: #4c7dff; }
  .vb-tool .tip { display: none; position: absolute; left: 40px; background: #000; padding: 3px 7px; border-radius: 4px; white-space: nowrap; z-index: 2; font-size: 12px; }
  .vb-tool:hover .tip { display: block; }
  .vb-hr { width: 24px; height: 1px; background: #44464d; margin: 6px 0; }
  .vb-canvas { display: grid; place-items: center; background: #18191c; position: relative; overflow: hidden; }
  .vb-canvas-frame { box-shadow: 0 0 0 1px #000, 0 10px 40px rgba(0,0,0,.5); }
  .vb-float { position: absolute; top: 10px; left: 12px; display: flex; gap: 6px; }
  .vb-chip { background: #2b2d31; border: 1px solid #3a3c42; border-radius: 5px; padding: 4px 8px; font-size: 12px; }
  .vb-chip.on { border-color: #4c7dff; color: #fff; }
  .vb-dock { background: #232428; border-left: 1px solid #111; overflow: auto; }
  .vb-panel { border-bottom: 1px solid #111; }
  .vb-panel h3 { margin: 0; padding: 8px 12px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8d9098; background: #2b2d31; display: flex; justify-content: space-between; }
  .vb-panel .body { padding: 10px 12px; }
  .vb-steps { list-style: none; margin: 0; padding: 4px 0; }
  .vb-steps li { display: flex; align-items: center; gap: 8px; padding: 5px 12px; }
  .vb-steps li.cur { background: #2f3a57; color: #fff; }
  .vb-steps .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; background: #3a3c42; }
  .vb-steps li.done .n { background: #2fa36b; color: #fff; }
  .vb-steps li.cur .n { background: #4c7dff; color: #fff; }
  .vb-steps .meta { margin-left: auto; color: #7b7e86; font: 11px 'JetBrains Mono', monospace; }
  .vb-swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .vb-sw { border-radius: 4px; height: 30px; border: 2px solid transparent; }
  .vb-sw.on { border-color: #fff; }
  .vb-roles { margin-top: 8px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; font-size: 10px; color: #8d9098; text-align: center; }
  .vb-exp p { margin: 0 0 10px; }
  .vb-figs { display: flex; gap: 12px; }
  .vb-figs figure { margin: 0; font-size: 11px; color: #8d9098; text-align: center; }
  .vb-figs figure svg { border-radius: 3px; margin-bottom: 4px; }
  .vb-btn { border: 0; border-radius: 5px; padding: 7px 12px; background: #3a3c42; font-weight: 500; }
  .vb-btn.primary { background: #4c7dff; color: #fff; }
  .vb-btn:hover { filter: brightness(1.15); }
  .vb-kbd { font: 10px 'JetBrains Mono', monospace; background: rgba(0,0,0,.3); border-radius: 3px; padding: 1px 4px; margin-left: 6px; }
  .vb-result { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font: 12px 'JetBrains Mono', monospace; }
  .vb-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .vb-status { grid-column: 1 / -1; display: flex; gap: 18px; align-items: center; padding: 0 12px; background: #4c7dff; color: #fff; font: 11px 'JetBrains Mono', monospace; }
  .vb-status span:last-child { margin-left: auto; padding-right: 380px; }
  .vb-course { display: grid; grid-template-columns: 200px 1fr; grid-template-rows: 36px 1fr; min-height: 100vh; }
  .vb-side { background: #232428; border-right: 1px solid #111; padding: 10px 8px; }
  .vb-side a { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 5px; color: #a4a6ad; cursor: pointer; }
  .vb-side a.on { background: #2f3a57; color: #fff; }
  .vb-side .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #6b6e75; padding: 14px 10px 6px; }
  .vb-main { padding: 22px 28px 90px; overflow: auto; }
  .vb-main h1 { margin: 0 0 4px; font-size: 20px; color: #fff; }
  .vb-sub { color: #8d9098; margin-bottom: 16px; }
  .vb-progress { height: 6px; border-radius: 3px; background: #2b2d31; overflow: hidden; margin-bottom: 20px; max-width: 420px; }
  .vb-progress i { display: block; height: 100%; width: 27%; background: #2fa36b; }
  .vb-daily { display: flex; gap: 16px; align-items: center; background: #2b2d31; border: 1px solid #3a3c42; border-radius: 8px; padding: 12px 14px; margin-bottom: 22px; }
  .vb-daily .k { font-size: 11px; color: #4c7dff; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .vb-daily .t { color: #fff; font-weight: 600; font-size: 15px; }
  .vb-table { width: 100%; border-collapse: collapse; }
  .vb-table th { text-align: left; font-weight: 500; font-size: 11px; color: #7b7e86; text-transform: uppercase; letter-spacing: .05em; padding: 6px 10px; border-bottom: 1px solid #333; }
  .vb-table td { padding: 8px 10px; border-bottom: 1px solid #2a2b2f; }
  .vb-table tr:hover td { background: #26272b; }
  .vb-table tr.cur td { background: #252d42; }
  .vb-table tr.locked td { color: #5d6067; }
  .vb-m { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; font-size: 11px; font-weight: 700; margin-right: 3px; background: #2b2d31; color: #5d6067; }
  .vb-m.passed { background: #1f4d36; color: #5fe0a0; }
  .vb-m.open { background: #2f3a57; color: #9fb7ff; }
  .vb-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8d9098; }
  .vb-mobile { min-height: 100vh; display: grid; place-items: center; padding: 16px 16px 90px; background: #1e1f22; }
  .vb-card { max-width: 340px; background: #2b2d31; border: 1px solid #3a3c42; border-radius: 10px; padding: 22px; display: grid; gap: 12px; justify-items: start; }
  .vb-card h1 { margin: 0; font-size: 17px; color: #fff; }
  .vb-card p { margin: 0; color: #a4a6ad; }

  /* =====================================================================
     C - Notebook: light editorial textbook, reading-first, canvas as a figure
     ===================================================================== */
  .vc { min-height: 100vh; background: #f5efe3; color: #2a2522; font: 17px/1.6 'Source Serif 4', Georgia, serif; padding-bottom: 90px;
    background-image: linear-gradient(#e9e1d1 1px, transparent 1px); background-size: 100% 28px; }
  .vc-top { display: flex; align-items: baseline; gap: 22px; padding: 18px 32px; border-bottom: 2px solid #2a2522; background: #f5efe3; }
  .vc-top .brand { font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
  .vc-top a { font-size: 15px; color: #6b625b; cursor: pointer; text-decoration: none; }
  .vc-top a.on { color: #b8362b; text-decoration: underline; text-underline-offset: 4px; }
  .vc-page { display: grid; grid-template-columns: 190px minmax(0, 640px) 190px; gap: 36px; justify-content: center; padding: 34px 24px; }
  .vc-toc { font-size: 14px; position: sticky; top: 20px; align-self: start; }
  .vc-toc .cap { font-variant: small-caps; letter-spacing: .08em; color: #8a7f75; margin-bottom: 8px; }
  .vc-toc ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .vc-toc li { counter-increment: s; padding: 4px 0 4px 26px; position: relative; color: #8a7f75; }
  .vc-toc li::before { content: counter(s) "."; position: absolute; left: 0; font-weight: 600; }
  .vc-toc li.done { color: #2a2522; text-decoration: line-through; text-decoration-color: #b8362b; }
  .vc-toc li.cur { color: #b8362b; font-weight: 600; }
  .vc-kicker { font-variant: small-caps; letter-spacing: .1em; color: #b8362b; font-size: 15px; }
  .vc-main h1 { font-size: 40px; line-height: 1.1; margin: 4px 0 18px; letter-spacing: -.02em; }
  .vc-main p { margin: 0 0 16px; }
  .vc-drop::first-letter { float: left; font-size: 58px; line-height: .9; padding: 4px 8px 0 0; font-weight: 700; color: #b8362b; }
  .vc-fig { display: flex; gap: 28px; justify-content: center; margin: 22px 0; padding: 16px; border-top: 1px solid #cfc4b2; border-bottom: 1px solid #cfc4b2; }
  .vc-fig figure { margin: 0; text-align: center; font-size: 14px; font-style: italic; color: #6b625b; }
  .vc-fig figure svg { margin: 0 auto 6px; }
  .vc-mark { font-style: normal; font-weight: 700; }
  .vc-ex { margin-top: 28px; background: #fffdf8; border: 1.5px solid #2a2522; box-shadow: 6px 6px 0 #2a2522; padding: 18px 20px 16px; }
  .vc-ex-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .vc-ex-h b { font-variant: small-caps; letter-spacing: .1em; font-size: 15px; }
  .vc-ex-h span { font-size: 14px; color: #6b625b; font-style: italic; }
  .vc-canvas { display: flex; justify-content: center; }
  .vc-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 2px; margin-top: 14px; font-size: 15px; }
  .vc-tools button { border: 0; background: none; padding: 2px 6px; color: #6b625b; }
  .vc-tools button.on { color: #2a2522; font-weight: 700; text-decoration: underline wavy #b8362b; text-underline-offset: 5px; }
  .vc-tools kbd { font: 12px 'JetBrains Mono', monospace; color: #a3978b; }
  .vc-tools .dot { color: #cfc4b2; }
  .vc-cta { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }
  .vc-btn { border: 1.5px solid #2a2522; background: #fffdf8; padding: 6px 16px; font-size: 15px; }
  .vc-btn.primary { background: #2a2522; color: #f5efe3; }
  .vc-margin { position: sticky; top: 20px; align-self: start; font-family: 'Caveat', cursive; font-size: 21px; line-height: 1.2; color: #3d4a7a; }
  .vc-chips { display: grid; gap: 8px; margin-bottom: 26px; }
  .vc-chip { display: flex; align-items: center; gap: 10px; }
  .vc-chip i { width: 34px; height: 22px; border: 1.5px solid #2a2522; }
  .vc-chip.on i { box-shadow: 3px 3px 0 #b8362b; }
  .vc-note { background: #fff3a8; padding: 12px 14px; transform: rotate(-2deg); box-shadow: 2px 4px 10px rgba(0,0,0,.15); color: #2a2522; }
  .vc-modes { font-family: 'Source Serif 4', serif; font-size: 14px; color: #6b625b; margin-top: 26px; }
  .vc-modes b { color: #2a2522; }
  .vc-syl { max-width: 720px; margin: 0 auto; padding: 44px 24px; }
  .vc-syl h1 { font-size: 56px; line-height: 1; letter-spacing: -.03em; margin: 0 0 8px; }
  .vc-syl .lede { font-size: 20px; font-style: italic; color: #6b625b; margin-bottom: 34px; }
  .vc-today { border: 1.5px solid #2a2522; box-shadow: 6px 6px 0 #b8362b; background: #fffdf8; padding: 16px 20px; display: flex; gap: 20px; align-items: center; margin-bottom: 40px; }
  .vc-today .k { font-variant: small-caps; letter-spacing: .1em; color: #b8362b; font-size: 14px; }
  .vc-today .t { font-size: 24px; font-weight: 600; line-height: 1.2; }

          {TOOLS.map(t => (
            <button key={t.k} title={`${t.label} (${t.key})`} className={`vd-tool ${ui.tool === t.k ? 'on' : ''}`} onClick={() => ui.setTool(t.k)}>
              <Icon name={t.k} color="#3b3355" px={3} />
            </button>
          ))}
          <div className="vd-gap" />
          <button className="vd-tool" title="Undo (Ctrl+Z)"><Icon name="undo" color="#3b3355" px={3} /></button>
          <button className={`vd-tool ${ui.grid ? 'on' : ''}`} title="Grid (#)" onClick={ui.toggleGrid}><Icon name="grid" color="#3b3355" px={3} /></button>
        </div>
        <div className="vd-stage">
          <Pixels rows={DRAWING} colors={C} px={26} grid={ui.grid} guide={ui.guide ? GUIDE : null} marks={ui.checked ? MARKS : []}
            markColors={{ missing: '#ffa62b', extra: '#ff4f8b' }} checker checkerColors={['#ffffff', '#f4f0ff']} gridColor="rgba(124,92,255,.10)" />
        </div>
        <div className="vd-pill vd-palcol">
          {PALETTE.map(p => (
            <div key={p.k} className={`vd-sw ${ui.color === p.k ? 'on' : ''}`} style={{ background: C[p.k], cursor: 'pointer' }} onClick={() => ui.setColor(p.k)}>
              <span className="r">{p.role}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="vd-sheet">
        <div>
          <h3>Step 4 · Shadow</h3>
          <p>{STEPS[CUR].text}</p>
          {more && (
            <div className="vd-figs">
              <figure><Pixels rows={BALL_GOOD} colors={C} px={6} />Good</figure>
              <figure><Pixels rows={BALL_PILLOW} colors={C} px={6} />Pillow</figure>
            </div>
          )}
          <button className="vd-more" onClick={() => setMore(m => !m)}>{more ? 'Show less' : 'Show examples'}</button>
        </div>
        <div className="vd-acts">
          <button className="vd-btn" onClick={ui.toggleGuide}>{ui.guide ? 'Hide guide' : 'Show guide'}</button>
          <button className="vd-btn primary" onClick={ui.toggleCheck}>Check ✨</button>
        </div>
        {ui.checked && <div className="vd-toast">Nice! {DRAWN}/{TOTAL} shadow pixels. {MISSING} to go (orange) and {EXTRA} stray pixel (pink). Lesson {SCORE}%, pass at 95%.</div>}
      </div>
    </div></div>
  );
}

  return (
    <div className="vd"><div className="vd-home">
      <nav className="vd-nav">

        <a className="on">Learn</a><a>Studio</a><a>Gallery</a>
      </nav>
      <div className="vd-hero">
        <div className="vd-card vd-continue">
          <div className="spr"><Pixels rows={SLIME} colors={C} px={8} /></div>
          <div>
            <div className="k">Continue · Lesson {cur.n} · Step 4 of 5</div>

            <p style={{ margin: '0 0 14px', opacity: .9 }}>Pick a light direction and shade a round slime.</p>
            <button className="vd-btn" onClick={goto('lesson')}>Keep going →</button>

        </div>
        <div className="vd-card vd-daily">
          <div className="k">✿ Today's prompt</div>

          <div className="vd-tags">{DAILY.tags.map(t => <span key={t}>{t}</span>)}</div>
          <div style={{ display: 'flex', gap: 8 }}>

        </div>
      </div>
      <div className="vd-row-h"><h3>Your Course</h3><span style={{ color: '#9a90b8', fontWeight: 700 }}>3 of 11 done</span></div>
      <div className="vd-carousel">
        {COURSE.map(l => (

            <div className="thumb"><Pixels rows={THUMBS[l.thumb]} colors={lessonThumbColors(l)} px={l.thumb === 'slime' ? 5 : 10} /></div>

function DMobile() {
  return (
    <div className="vd vd-mobile">
      <div className="bubble"><Pixels rows={SAD} colors={SAD_C} px={9} /></div>
      <h1>Oh no, a tiny screen!</h1>
      <p>Pixel Art Tutor isn't supported on mobile yet. It needs a mouse and keyboard to draw.</p>
      <button className="vd-btn primary">Continue anyway</button>
    </div>
  );
}

// ---------------------------------------------------------------- switcher
const VARIANTS = [
  { key: 'A', name: 'Arcade', screens: { course: ACourse, lesson: ALesson, mobile: AMobile } },
  { key: 'B', name: 'Workbench', screens: { course: BCourse, lesson: BLesson, mobile: BMobile } },
  { key: 'C', name: 'Notebook', screens: { course: CCourse, lesson: CLesson, mobile: CMobile } },
  { key: 'D', name: 'Soft focus', screens: { course: DCourse, lesson: DLesson, mobile: DMobile } },
];
const SCREENS = ['course', 'lesson', 'mobile'];

function cycle(dir) {
  const cur = new URLSearchParams(search).get('variant') ?? 'A';
  const i = Math.max(0, VARIANTS.findIndex(v => v.key === cur));
  setParam('variant', VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
}
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
  if (['1', '2', '3'].includes(e.key)) setParam('screen', SCREENS[+e.key - 1]);
});

function PrototypeSwitcher({ variant, screen }) {
  return (
    <div className="proto-bar">
      <button onClick={() => cycle(-1)} aria-label="Previous variant">◀</button>
      <span className="lbl">{variant.key} ({variant.name})</span>
      <button onClick={() => cycle(1)} aria-label="Next variant">▶</button>
      <span className="sep" />
      {SCREENS.map((s, i) => <button key={s} className={s === screen ? 'on' : ''} onClick={() => setParam('screen', s)}>{i + 1} {s}</button>)}
    </div>
  );
}

function App() {
  const p = new URLSearchParams(useSearch());
  const variant = VARIANTS.find(v => v.key === p.get('variant')) ?? VARIANTS[0];
  const screen = SCREENS.includes(p.get('screen')) ? p.get('screen') : 'lesson';
  const Screen = variant.screens[screen];
  return (
    <>
      <Screen key={variant.key + screen} />
      <PrototypeSwitcher variant={variant} screen={screen} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
